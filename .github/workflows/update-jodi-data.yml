name: Update JODI gas data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-jodi-gas-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check 2026 JODI update schedule
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today="$(date -u +%Y-%m-%d)"
          case "$today" in
            2026-01-22|2026-02-20|2026-03-19|2026-04-22|2026-05-21|2026-06-23|2026-07-22|2026-08-21|2026-09-23|2026-10-22|2026-11-20|2026-12-22)
              echo "run=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Refresh generated data
        if: steps.schedule.outputs.run == 'true'
        run: node scripts/update-jodi-data.mjs

      - name: Commit and push if changed
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- src/data.js src/sector-data.js src/switching-data.js; then
            echo "No generated data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data.js src/sector-data.js src/switching-data.js
          git commit -m "data: update JODI gas actuals"
          git push
