<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>China Gas Explorer has moved</title>
    <meta name="description" content="The China Gas Explorer now lives at qrlow.me/china-gas/.">
    <link rel="canonical" href="https://qrlow.me/china-gas/">
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17212b;
        background: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(620px, 100%);
        padding: clamp(28px, 7vw, 56px);
        border: 1px solid #d9e1e8;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08);
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(32px, 7vw, 52px);
        line-height: 1.05;
        letter-spacing: -0.035em;
      }

      p {
        margin: 0 0 24px;
        color: #5d6b78;
        font-size: 18px;
        line-height: 1.6;
      }

      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 10px 16px;
        border-radius: 7px;
        background: #1c3f5f;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:hover,
      a:focus-visible {
        background: #15324c;
      }

      a:focus-visible {
        outline: 3px solid rgba(60, 120, 181, 0.4);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>The China Gas Explorer has moved.</h1>
      <p>
        The live JODI dashboard and its step-by-step explanation now have a permanent home on qrlow.me.
        This repository is retained as an archive.
      </p>
      <a href="https://qrlow.me/china-gas/">Open the China Gas Explorer</a>
    </main>
  </body>
</html>
